[project]
name = "youtube-to-document-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: calls real external services (YouTube / OpenAI). Opt-in with RUN_INTEGRATION=1.",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM108"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[tool.ruff.lint.per-file-ignores]
# Prompts are natural-language text; wrapping them would change the prompt.
"app/prompts/*.py" = ["E501"]
